<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JINSUL 요일·주·월별 통계 현황</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg:#f5f3ee; --panel:#ffffff; --panel2:#faf8f3; --text:#242424; --muted:#706d67;
      --line:#e5dfd3; --gold:#b69a68; --gold2:#d8c7a3; --dark:#2c2d2f; --good:#2f7a5b;
      --warn:#b36a2e; --danger:#a94b4b; --shadow:0 16px 40px rgba(52,45,34,.08);
    }
    [data-theme="dark"]{
      --bg:#171817; --panel:#222321; --panel2:#2a2b28; --text:#f2efe7; --muted:#b8b3a9;
      --line:#3a3a35; --gold:#d3b77c; --gold2:#8d7547; --dark:#f2efe7; --shadow:0 18px 45px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.2s}
    button,input,select{font:inherit}.wrap{max-width:1500px;margin:auto;padding:22px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}.brand img{width:168px;max-width:42vw;height:auto;object-fit:contain}
    .brand-text h1{font-size:22px;margin:0 0 3px}.brand-text p{margin:0;color:var(--muted);font-size:13px}
    .top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer;box-shadow:var(--shadow)}
    .hero{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
    .hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:center}.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:0;color:var(--muted);line-height:1.6}
    .dropzone{border:1.5px dashed var(--gold);border-radius:18px;padding:18px;text-align:center;background:color-mix(in srgb,var(--gold) 7%,transparent);cursor:pointer;min-height:124px;display:flex;flex-direction:column;justify-content:center}
    .dropzone.drag{background:color-mix(in srgb,var(--gold) 16%,transparent)}.dropzone strong{font-size:16px}.dropzone small{display:block;color:var(--muted);margin-top:7px}.file-name{margin-top:8px;color:var(--gold);font-weight:700;word-break:break-all}
    #fileInput{display:none}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow)}
    .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 14px;cursor:pointer}.seg button:last-child{border-right:0}.seg button.active{background:var(--dark);color:var(--bg);font-weight:700}
    .date-box{display:flex;gap:7px;align-items:center;margin-left:auto}.date-box input{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:10px}.primary{border:0;background:var(--gold);color:#fff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.secondary{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 13px;cursor:pointer}
    .notice{display:none;background:#fff7df;color:#795d1d;border:1px solid #ead18f;border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:13px}.notice.show{display:block}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:23px 0 11px}.section-title h3{margin:0;font-size:19px}.section-title span{color:var(--muted);font-size:12px}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);min-width:0}.kpi .label{font-size:12px;color:var(--muted);margin-bottom:8px}.kpi .value{font-weight:850;font-size:21px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
    .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);min-width:0}.chart-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.chart-head h4{margin:0;font-size:15px}.chart-head small{color:var(--muted)}.chart-box{height:330px;position:relative}
    .table-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.table-scroll{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:12px}th{position:sticky;top:0;background:var(--panel2);z-index:1;color:var(--muted);font-weight:750}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}th:first-child{background:var(--panel2);z-index:2}tbody tr:hover td{background:color-mix(in srgb,var(--gold) 6%,var(--panel))}.positive{color:var(--good);font-weight:700}.negative{color:var(--danger);font-weight:700}
    .weekday-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.weekday-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow)}.weekday-card h5{margin:0 0 9px;font-size:15px}.weekday-card dl{margin:0;display:grid;gap:7px}.weekday-card dl div{display:flex;justify-content:space-between;gap:8px}.weekday-card dt{font-size:11px;color:var(--muted)}.weekday-card dd{margin:0;font-size:12px;font-weight:800;text-align:right}
    .insight-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.insight{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.insight b{display:block;font-size:13px;margin-bottom:8px}.insight strong{font-size:19px;color:var(--gold)}.insight p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
    .empty{padding:50px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:26px 0 8px}
    @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.weekday-grid{grid-template-columns:repeat(4,1fr)}.insight-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.wrap{padding:12px}.brand-text{display:none}.hero-grid{grid-template-columns:1fr}.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.weekday-grid{grid-template-columns:repeat(2,1fr)}.date-box{margin-left:0;width:100%;flex-wrap:wrap}.topbar{align-items:flex-start}.chart-box{height:290px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <img src="https://xginini-dot.github.io/jinsul_V1.0/%EC%A7%84%EC%84%A4%EB%A1%9C%EA%B3%A0.png" alt="JINSUL" onerror="this.style.display='none'">
      <div class="brand-text"><h1>요일·주·월별 통계 현황</h1><p>일별 수입통계 엑셀 자동 분석</p></div>
    </div>
    <div class="top-actions"><button class="icon-btn" onclick="history.back()">← 뒤로가기</button><button class="icon-btn" id="themeBtn">◐ 다크/라이트</button></div>
  </header>

  <section class="hero">
    <div class="hero-grid">
      <div><h2>병원 운영 흐름을 한눈에 비교하세요.</h2><p>요일별, 주별, 월별로 초진·재진·내원·진료비·급여·비급여를 자동 집계합니다. 전체 합계와 일평균을 동시에 확인하고, 요일별 효율과 변동성도 비교할 수 있습니다.</p></div>
      <label class="dropzone" id="dropzone" for="fileInput"><strong>엑셀 파일 선택 또는 드래그</strong><small>.xls / .xlsx · 일별 수입통계 파일</small><span class="file-name" id="fileName">파일을 업로드해 주세요</span><input id="fileInput" type="file" accept=".xls,.xlsx,.xlsm,.csv"></label>
    </div>
  </section>

  <div class="toolbar">
    <div class="seg" id="periodSeg"><button data-period="weekday" class="active">요일별</button><button data-period="week">주별</button><button data-period="month">월별</button></div>
    <button class="secondary" id="exportBtn">표 CSV 저장</button>
    <div class="date-box"><input type="date" id="startDate"><span>~</span><input type="date" id="endDate"><button class="primary" id="applyBtn">기간 적용</button><button class="secondary" id="resetBtn">전체 기간</button></div>
  </div>
  <div class="notice" id="notice"></div>

  <main id="dashboard"><div class="empty">엑셀 파일을 업로드하면 통계가 표시됩니다.</div></main>
  <div class="footer">JINSUL · 경험과 가치를 현실화 하는 컨설팅</div>
</div>
<script>
const state={rows:[],filtered:[],period:'weekday',charts:[],summaryRows:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtInt=n=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const fmtWon=n=>'₩'+fmtInt(n);
const fmtPct=n=>(Number(n)||0).toFixed(1)+'%';
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const weekdays=['일','월','화','수','목','금','토'];
const weekdayOrder=['월','화','수','목','금','토','일'];
function parseNum(v){if(typeof v==='number')return isFinite(v)?v:0; if(v==null)return 0; const s=String(v).replace(/[₩원,%\s,]/g,''); const n=Number(s); return isFinite(n)?n:0}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v); if(p)return new Date(p.y,p.m-1,p.d)}
  const s=String(v||'').trim(); let m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function norm(s){return String(s||'').replace(/[\s\[\]()_-]/g,'').toLowerCase()}
const aliases={date:['일자','날짜','진료일자','진료일'],totalRevenue:['총진료비','진료비총액','총수입'],insured:['급여총액','급여금액','보험급여'],noninsured:['비급여','비급여금액','비급여총액'],newCount:['초진수','신환수','초진'],returnCount:['재진수','재진'],visits:['인원계','총내원','총내원수','환자수','합계']};
function detectHeader(matrix){
  let best={idx:0,score:-1,map:{}};
  matrix.slice(0,30).forEach((row,idx)=>{let score=0,map={}; Object.entries(aliases).forEach(([key,list])=>{const ci=row.findIndex(c=>list.some(a=>norm(c)===norm(a)||norm(c).includes(norm(a))));if(ci>=0){map[key]=ci;score++}});if(score>best.score)best={idx,score,map}});return best;
}
function workbookRows(wb){
  let all=[];
  wb.SheetNames.forEach(sheet=>{const matrix=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:null,raw:true});const h=detectHeader(matrix);if(h.score<4)return;for(let i=h.idx+1;i<matrix.length;i++){const r=matrix[i],date=parseDate(r[h.map.date]);if(!date)continue;const newCount=parseNum(r[h.map.newCount]),returnCount=parseNum(r[h.map.returnCount]);const visits=h.map.visits!=null?parseNum(r[h.map.visits]):newCount+returnCount;const totalRevenue=parseNum(r[h.map.totalRevenue]),insured=parseNum(r[h.map.insured]),noninsured=parseNum(r[h.map.noninsured]);if(!(visits||totalRevenue||insured||noninsured))continue;all.push({date,newCount,returnCount,visits:visits||newCount+returnCount,totalRevenue,insured,noninsured,source:sheet})}});
  const byDate=new Map();all.forEach(r=>{const k=iso(r.date);if(!byDate.has(k))byDate.set(k,{...r});else{const x=byDate.get(k);['newCount','returnCount','visits','totalRevenue','insured','noninsured'].forEach(m=>x[m]+=r[m])}});return [...byDate.values()].sort((a,b)=>a.date-b.date);
}
function aggregate(rows,period){
  const map=new Map();
  rows.forEach(r=>{let key,label,sortKey;if(period==='weekday'){key=weekdays[r.date.getDay()];label=key+'요일';sortKey=weekdayOrder.indexOf(key)}else if(period==='month'){key=`${r.date.getFullYear()}-${String(r.date.getMonth()+1).padStart(2,'0')}`;label=`${r.date.getFullYear()}년 ${r.date.getMonth()+1}월`;sortKey=key}else{const d=new Date(r.date);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);const e=new Date(d);e.setDate(e.getDate()+6);key=iso(d);label=`${d.getMonth()+1}/${d.getDate()}~${e.getMonth()+1}/${e.getDate()}`;sortKey=key}
    if(!map.has(key))map.set(key,{key,label,sortKey,days:0,newCount:0,returnCount:0,visits:0,totalRevenue:0,insured:0,noninsured:0});const x=map.get(key);x.days++;['newCount','returnCount','visits','totalRevenue','insured','noninsured'].forEach(m=>x[m]+=r[m]);});
  return [...map.values()].sort((a,b)=>period==='weekday'?a.sortKey-b.sortKey:String(a.sortKey).localeCompare(String(b.sortKey))).map(x=>({...x,insuredRate:x.totalRevenue?x.insured/x.totalRevenue*100:0,noninsuredRate:x.totalRevenue?x.noninsured/x.totalRevenue*100:0,perVisit:x.visits?x.totalRevenue/x.visits:0,avgNew:x.newCount/x.days,avgReturn:x.returnCount/x.days,avgVisits:x.visits/x.days,avgTotal:x.totalRevenue/x.days,avgInsured:x.insured/x.days,avgNoninsured:x.noninsured/x.days,avgPerVisit:x.perVisit}));
}
function totals(rows){const t={days:rows.length,newCount:0,returnCount:0,visits:0,totalRevenue:0,insured:0,noninsured:0};rows.forEach(r=>['newCount','returnCount','visits','totalRevenue','insured','noninsured'].forEach(m=>t[m]+=r[m]));t.insuredRate=t.totalRevenue?t.insured/t.totalRevenue*100:0;t.noninsuredRate=t.totalRevenue?t.noninsured/t.totalRevenue*100:0;t.perVisit=t.visits?t.totalRevenue/t.visits:0;return t}
function metricCard(label,value,sub){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function destroyCharts(){state.charts.forEach(c=>c.destroy());state.charts=[]}
function chart(canvas,type,labels,datasets,opts={}){const c=new Chart(canvas,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:11,usePointStyle:true}},tooltip:{callbacks:{label:ctx=>{let v=ctx.parsed.y??ctx.parsed;return `${ctx.dataset.label}: ${opts.money?fmtWon(v):opts.percent?fmtPct(v):fmtInt(v)}`}}}},scales:type==='doughnut'?{}:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true}},y:{beginAtZero:true,ticks:{callback:v=>opts.money?(Math.abs(v)>=100000000?(v/100000000).toFixed(1)+'억':Math.abs(v)>=10000?(v/10000).toFixed(0)+'만':v):opts.percent?v+'%':fmtInt(v)}}}}});state.charts.push(c)}
function cv(arr){const vals=arr.filter(v=>isFinite(v));if(!vals.length)return 0;const mean=vals.reduce((a,b)=>a+b,0)/vals.length;if(!mean)return 0;return Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length)/mean*100}
function render(){
  destroyCharts();if(!state.filtered.length){$('#dashboard').innerHTML='<div class="empty">선택한 기간에 데이터가 없습니다.</div>';return}
  const t=totals(state.filtered), a=aggregate(state.filtered,state.period);state.summaryRows=a;const avg=x=>t.days?t[x]/t.days:0;
  const typeName={weekday:'요일별',week:'주별',month:'월별'}[state.period];
  let html=`<div class="section-title"><h3>전체값 및 일평균</h3><span>${iso(state.filtered[0].date)} ~ ${iso(state.filtered.at(-1).date)} · ${fmtInt(t.days)}일</span></div><div class="kpis">
  ${metricCard('초진수',fmtInt(t.newCount),`일평균 ${fmtInt(avg('newCount'))}명`)}${metricCard('재진수',fmtInt(t.returnCount),`일평균 ${fmtInt(avg('returnCount'))}`)}${metricCard('총내원',fmtInt(t.visits),`일평균 ${fmtInt(avg('visits'))}명`)}${metricCard('총진료비',fmtWon(t.totalRevenue),`일평균 ${fmtWon(avg('totalRevenue'))}`)}${metricCard('건당 진료비',fmtWon(t.perVisit),'총진료비 ÷ 총내원')}
  ${metricCard('급여총액',fmtWon(t.insured),`일평균 ${fmtWon(avg('insured'))}`)}${metricCard('급여총액 비율',fmtPct(t.insuredRate),'총진료비 대비')}${metricCard('비급여 금액',fmtWon(t.noninsured),`일평균 ${fmtWon(avg('noninsured'))}`)}${metricCard('비급여금액 비율',fmtPct(t.noninsuredRate),'총진료비 대비')}${metricCard('분석 일수',fmtInt(t.days)+'일',`${typeName} ${fmtInt(a.length)}개 구간`)}</div>`;
  html+=`<div class="section-title"><h3>${typeName} 그래프</h3><span>합계와 평균을 함께 비교할 수 있습니다.</span></div><div class="charts">
  <div class="chart-card"><div class="chart-head"><h4>초진·재진·총내원</h4><small>구간별 합계</small></div><div class="chart-box"><canvas id="visitChart"></canvas></div></div>
  <div class="chart-card"><div class="chart-head"><h4>총진료비·급여·비급여</h4><small>구간별 금액</small></div><div class="chart-box"><canvas id="revenueChart"></canvas></div></div>
  <div class="chart-card"><div class="chart-head"><h4>급여·비급여 비율</h4><small>총진료비 대비</small></div><div class="chart-box"><canvas id="ratioChart"></canvas></div></div>
  <div class="chart-card"><div class="chart-head"><h4>건당 진료비와 일평균 총진료비</h4><small>운영 효율 비교</small></div><div class="chart-box"><canvas id="effChart"></canvas></div></div></div>`;
  if(state.period==='weekday')html+=weekdayExtras(a);
  html+=tableHTML(a,typeName);$('#dashboard').innerHTML=html;
  const labels=a.map(x=>x.label);
  chart($('#visitChart'),'bar',labels,[{label:'초진수',data:a.map(x=>x.newCount)},{label:'재진수',data:a.map(x=>x.returnCount)},{label:'총내원',data:a.map(x=>x.visits)}]);
  chart($('#revenueChart'),'bar',labels,[{label:'총진료비',data:a.map(x=>x.totalRevenue)},{label:'급여총액',data:a.map(x=>x.insured)},{label:'비급여',data:a.map(x=>x.noninsured)}],{money:true});
  chart($('#ratioChart'),'line',labels,[{label:'급여 비율',data:a.map(x=>x.insuredRate),tension:.25},{label:'비급여 비율',data:a.map(x=>x.noninsuredRate),tension:.25}],{percent:true});
  chart($('#effChart'),'line',labels,[{label:'건당 진료비',data:a.map(x=>x.perVisit),tension:.25},{label:'일평균 총진료비',data:a.map(x=>x.avgTotal),tension:.25}],{money:true});
  if(state.period==='weekday')renderWeekdayCharts(a);
}
function weekdayExtras(a){
  const valid=a.filter(x=>x.days);const bestVisits=[...valid].sort((x,y)=>y.avgVisits-x.avgVisits)[0],bestRev=[...valid].sort((x,y)=>y.avgTotal-x.avgTotal)[0],bestUnit=[...valid].sort((x,y)=>y.perVisit-x.perVisit)[0],bestNon=[...valid].sort((x,y)=>y.noninsuredRate-x.noninsuredRate)[0];
  return `<div class="section-title"><h3>요일별 추가 비교</h3><span>요일별 평균·구성·변동성을 비교합니다.</span></div><div class="insight-grid">
  <div class="insight"><b>일평균 내원 최다</b><strong>${bestVisits?.label||'-'}</strong><p>${fmtInt(bestVisits?.avgVisits)}명 / 일</p></div><div class="insight"><b>일평균 진료비 최고</b><strong>${bestRev?.label||'-'}</strong><p>${fmtWon(bestRev?.avgTotal)} / 일</p></div><div class="insight"><b>건당 진료비 최고</b><strong>${bestUnit?.label||'-'}</strong><p>${fmtWon(bestUnit?.perVisit)} / 건</p></div><div class="insight"><b>비급여 비중 최고</b><strong>${bestNon?.label||'-'}</strong><p>${fmtPct(bestNon?.noninsuredRate)}</p></div></div>
  <div class="section-title"><h3>요일별 평균 카드</h3><span>해당 요일이 반복된 일수 기준</span></div><div class="weekday-grid">${a.map(x=>`<div class="weekday-card"><h5>${x.label} <small style="color:var(--muted)">${x.days}일</small></h5><dl><div><dt>평균 초진</dt><dd>${fmtInt(x.avgNew)}명</dd></div><div><dt>평균 재진</dt><dd>${fmtInt(x.avgReturn)}명</dd></div><div><dt>평균 내원</dt><dd>${fmtInt(x.avgVisits)}명</dd></div><div><dt>평균 진료비</dt><dd>${fmtWon(x.avgTotal)}</dd></div><div><dt>건당 진료비</dt><dd>${fmtWon(x.perVisit)}</dd></div><div><dt>비급여 비율</dt><dd>${fmtPct(x.noninsuredRate)}</dd></div></dl></div>`).join('')}</div>
  <div class="charts" style="margin-top:14px"><div class="chart-card"><div class="chart-head"><h4>요일별 일평균 운영 규모</h4><small>요일 횟수 차이를 보정한 평균</small></div><div class="chart-box"><canvas id="weekdayAvgChart"></canvas></div></div><div class="chart-card"><div class="chart-head"><h4>요일별 변동성</h4><small>변동계수(CV), 낮을수록 안정적</small></div><div class="chart-box"><canvas id="weekdayCvChart"></canvas></div></div></div>`;
}
function renderWeekdayCharts(a){
  chart($('#weekdayAvgChart'),'bar',a.map(x=>x.label),[{label:'일평균 내원',data:a.map(x=>x.avgVisits)},{label:'일평균 초진',data:a.map(x=>x.avgNew)},{label:'일평균 재진',data:a.map(x=>x.avgReturn)}]);
  const groups={};state.filtered.forEach(r=>{const k=weekdays[r.date.getDay()]+'요일';(groups[k]??=[]).push(r)});const labels=a.map(x=>x.label);chart($('#weekdayCvChart'),'bar',labels,[{label:'총진료비 변동성',data:labels.map(k=>cv((groups[k]||[]).map(r=>r.totalRevenue)))},{label:'총내원 변동성',data:labels.map(k=>cv((groups[k]||[]).map(r=>r.visits)))}],{percent:true});
}
function tableHTML(a,typeName){return `<div class="section-title"><h3>${typeName} 상세표</h3><span>합계 / 일평균</span></div><div class="table-card"><div class="table-scroll"><table><thead><tr><th>구분</th><th>일수</th><th>초진수</th><th>초진 일평균</th><th>재진수</th><th>재진 일평균</th><th>총내원</th><th>내원 일평균</th><th>총진료비</th><th>진료비 일평균</th><th>급여총액</th><th>급여 비율</th><th>비급여</th><th>비급여 비율</th><th>건당 진료비</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${x.label}</b></td><td>${fmtInt(x.days)}</td><td>${fmtInt(x.newCount)}</td><td>${fmtInt(x.avgNew)}</td><td>${fmtInt(x.returnCount)}</td><td>${fmtInt(x.avgReturn)}</td><td>${fmtInt(x.visits)}</td><td>${fmtInt(x.avgVisits)}</td><td>${fmtWon(x.totalRevenue)}</td><td>${fmtWon(x.avgTotal)}</td><td>${fmtWon(x.insured)}</td><td>${fmtPct(x.insuredRate)}</td><td>${fmtWon(x.noninsured)}</td><td>${fmtPct(x.noninsuredRate)}</td><td>${fmtWon(x.perVisit)}</td></tr>`).join('')}</tbody></table></div></div>`}
function setDateRange(){if(!state.rows.length)return;$('#startDate').value=iso(state.rows[0].date);$('#endDate').value=iso(state.rows.at(-1).date)}
function applyFilter(){const s=$('#startDate').value?new Date($('#startDate').value+'T00:00:00'):null,e=$('#endDate').value?new Date($('#endDate').value+'T23:59:59'):null;state.filtered=state.rows.filter(r=>(!s||r.date>=s)&&(!e||r.date<=e));render()}
function showNotice(msg){const n=$('#notice');n.textContent=msg;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),5000)}
async function loadFile(file){try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const rows=workbookRows(wb);if(!rows.length)throw new Error('필요한 컬럼을 찾지 못했습니다. 일자, 총진료비, 급여총액, 비급여, 초진수, 재진수 컬럼을 확인해 주세요.');state.rows=rows;state.filtered=[...rows];$('#fileName').textContent=`${file.name} · ${rows.length}일`;setDateRange();render();showNotice(`${rows.length}일의 데이터를 불러왔습니다. 동일 날짜가 여러 시트에 있으면 합산 처리됩니다.`)}catch(err){console.error(err);showNotice('파일 분석 오류: '+err.message)}}
$('#fileInput').addEventListener('change',e=>e.target.files[0]&&loadFile(e.target.files[0]));
const dz=$('#dropzone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>e.dataTransfer.files[0]&&loadFile(e.dataTransfer.files[0]));
$('#periodSeg').addEventListener('click',e=>{if(!e.target.dataset.period)return;$$('#periodSeg button').forEach(b=>b.classList.toggle('active',b===e.target));state.period=e.target.dataset.period;render()});
$('#applyBtn').onclick=applyFilter;$('#resetBtn').onclick=()=>{setDateRange();state.filtered=[...state.rows];render()};
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('jinsul-theme',dark?'light':'dark');render()};document.documentElement.dataset.theme=localStorage.getItem('jinsul-theme')||'light';
$('#exportBtn').onclick=()=>{if(!state.summaryRows.length)return showNotice('먼저 엑셀 파일을 업로드해 주세요.');const data=state.summaryRows.map(x=>({'구분':x.label,'일수':x.days,'초진수':Math.round(x.newCount),'초진 일평균':Math.round(x.avgNew),'재진수':Math.round(x.returnCount),'재진 일평균':Math.round(x.avgReturn),'총내원':Math.round(x.visits),'총내원 일평균':Math.round(x.avgVisits),'총진료비':Math.round(x.totalRevenue),'총진료비 일평균':Math.round(x.avgTotal),'급여총액':Math.round(x.insured),'급여총액 비율(%)':+x.insuredRate.toFixed(1),'비급여':Math.round(x.noninsured),'비급여 비율(%)':+x.noninsuredRate.toFixed(1),'건당 진료비':Math.round(x.perVisit)}));const ws=XLSX.utils.json_to_sheet(data),csv=XLSX.utils.sheet_to_csv(ws),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`JINSUL_${state.period}_통계_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)};
</script>
