name: Update clinic fees and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'hira*'
      - test_hira_update.py
      - xlsx.full.min.js
      - .github/workflows/hira-pages.yml
permissions:
  contents: read
concurrency:
  group: hira-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression checks
        run: |
          python -m unittest test_hira_update.py
          node --test hira_shared.test.cjs
      - name: Retrieve official clinic fees
        env:
          HIRA_API_KEY: ${{ secrets.HIRA_API_KEY }}
        run: python hira_update.py
      - name: Build public files
        run: python hira_build.py
      - name: Save last successful fee table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hira-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official clinic fee table"
            git push
          fi
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
