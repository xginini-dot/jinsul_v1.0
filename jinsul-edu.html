:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;min-width:0}.brand img{display:block;background:transparent;width:min(330px,42vw);height:auto;max-height:104px;object-fit:contain;object-position:left center;filter:drop-shadow(0 8px 18px rgba(38,32,26,.10))}html[data-theme="dark"] .brand img{filter:brightness(1.14) contrast(1.03) drop-shadow(0 8px 18px rgba(0,0,0,.30))}.brand{text-decoration:none;color:inherit}.top-actions{display:flex;gap:9px}.icon-btn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}.icon-btn:hover,.btn:hover{transform:translateY(-1px);border-color:var(--primary);box-shadow:0 8px 20px rgba(159,138,112,.18)}.hero{background:linear-gradient(135deg,#37322c,#716452 58%,#a28e74);color:white;border-radius:28px;padding:34px;box-shadow:0 24px 55px rgba(67,58,48,.28);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;right:-80px;top:-130px;background:rgba(255,255,255,.12)}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,44px);letter-spacing:-1.4px}.hero p{margin:0;opacity:.86;line-height:1.7}.hero-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:28px;align-items:end}.progress-panel{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.23);border-radius:20px;padding:18px;backdrop-filter:blur(8px)}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.progress-track{height:12px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:#fff;border-radius:999px;transition:.35s}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:13px;color:var(--muted);font-weight:700}.stat .value{font-size:28px;font-weight:800;margin-top:5px}.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(260px,1fr) auto auto;gap:12px;position:sticky;top:10px;z-index:5;box-shadow:var(--shadow)}.search{position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:14px;padding:13px 42px 13px 42px;font:inherit;outline:none}.search:before{content:'⌕';position:absolute;left:15px;top:8px;font-size:25px;color:var(--muted)}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(159,138,112,.16)}select{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:14px;padding:0 38px 0 14px;font:inherit;font-weight:700}.toggle-filter{display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-2px);border-color:rgba(159,138,112,.55)}.card.done{border-color:rgba(22,163,74,.5)}.card-head{display:flex;align-items:flex-start;gap:14px;padding:21px;cursor:pointer}.num{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:rgba(159,138,112,.14);color:var(--primary);display:grid;place-items:center;font-weight:800}.title-area{min-width:0;flex:1}.title-area h3{font-size:18px;margin:0 0 9px;line-height:1.35}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.badge.penalty{color:var(--danger);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.2)}.badge.optional{color:var(--warning);background:rgba(217,119,6,.08);border-color:rgba(217,119,6,.2)}.done-check{width:28px;height:28px;accent-color:var(--success);cursor:pointer}.chev{color:var(--muted);font-size:18px;transition:.2s}.card.open .chev{transform:rotate(180deg)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 21px 20px}.quick-item{background:var(--surface2);border-radius:13px;padding:12px}.quick-item span{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px}.quick-item b{font-size:13px;line-height:1.45}.detail{display:none;border-top:1px solid var(--line);padding:19px 21px 22px}.card.open .detail{display:block}.detail-row{display:grid;grid-template-columns:145px 1fr;gap:16px;padding:13px 0;border-bottom:1px dashed var(--line)}.detail-row:last-of-type{border-bottom:0}.detail-row dt{font-size:13px;font-weight:800;color:var(--primary)}.detail-row dd{margin:0;white-space:pre-line;line-height:1.65;font-size:14px}.memo-wrap{display:grid;grid-template-columns:160px 1fr;gap:10px;margin-top:16px}.memo-wrap input,.memo-wrap textarea{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:11px;font:inherit}.memo-wrap textarea{min-height:72px;resize:vertical}.card-actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.success{color:var(--success)}.empty{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:34px}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--surface);padding:12px 17px;border-radius:12px;opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:600px){.container{padding:14px 12px 55px}.brand img{width:min(230px,58vw);max-height:78px}.top-actions .label{display:none}.hero{padding:24px 20px}.summary{gap:9px}.stat{padding:14px}.stat .value{font-size:23px}.toolbar{top:6px;grid-template-columns:1fr}.search{grid-column:auto}.toggle-filter{padding:8px 4px}.card-head{padding:17px}.quick{padding:0 17px 17px;grid-template-columns:1fr}.detail{padding:16px 17px}.detail-row{grid-template-columns:1fr;gap:5px}.memo-wrap{grid-template-columns:1fr}.watermark{background-size:260px}}
@media print{body{background:#fff}.topbar,.toolbar,.top-actions,.card-actions,.memo-wrap,.watermark{display:none!important}.container{max-width:none;padding:0}.hero{box-shadow:none;border-radius:0;color:#111;background:#fff;border-bottom:2px solid #111}.progress-panel{border:1px solid #aaa}.summary{grid-template-columns:repeat(4,1fr)}.stat,.card{box-shadow:none;break-inside:avoid}.cards{grid-template-columns:1fr}.detail{display:block!important}.chev{display:none}}

const KEY='jinsul_education_status_v1';
let saved=JSON.parse(localStorage.getItem(KEY)||'{}');
const $=s=>document.querySelector(s);
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function state(no){return saved[no]||{done:false,date:'',memo:''}}
function persist(){localStorage.setItem(KEY,JSON.stringify(saved));updateStats()}
function updateStats(){const done=EDUCATIONS.filter(x=>state(x.no).done).length;$('#doneStat').textContent=done;$('#remainStat').textContent=EDUCATIONS.length-done;$('#totalStat').textContent=EDUCATIONS.length;$('#penaltyStat').textContent=EDUCATIONS.filter(x=>x.penalty).length;$('#progressText').textContent=`${done} / ${EDUCATIONS.length}`;$('#progressBar').style.width=`${done/EDUCATIONS.length*100}%`}
function toggleDone(no,checked){saved[no]={...state(no),done:checked};persist();render();toast(checked?'이수 완료로 저장했습니다.':'미이수 상태로 변경했습니다.')}
function saveDetail(no){saved[no]={...state(no),date:document.querySelector(`#date-${no}`).value,memo:document.querySelector(`#memo-${no}`).value};persist();toast('이수일과 메모를 저장했습니다.')}
function toggleCard(el){el.closest('.card').classList.toggle('open')}
function render(){const q=$('#searchInput').value.trim().toLowerCase(),cat=$('#categorySelect').value,pending=$('#pendingOnly').checked;const filtered=EDUCATIONS.filter(x=>{const blob=(x.title+' '+Object.values(x.fields).join(' ')).toLowerCase();return(!q||blob.includes(q))&&(cat==='전체'||x.category===cat)&&(!pending||!state(x.no).done)});$('#cards').innerHTML=filtered.length?filtered.map(x=>{const s=state(x.no),f=x.fields;return `<article class="card ${s.done?'done':''}"><div class="card-head" onclick="toggleCard(this)"><div class="num">${x.no}</div><div class="title-area"><h3>${esc(x.title)}</h3><div class="badges"><span class="badge">${x.category}</span>${x.penalty?'<span class="badge penalty">제재 명시</span>':''}${x.optional?'<span class="badge optional">선택</span>':''}</div></div><input class="done-check" type="checkbox" ${s.done?'checked':''} title="이수 완료" onclick="event.stopPropagation();toggleDone(${x.no},this.checked)"><span class="chev">⌄</span></div><div class="quick"><div class="quick-item"><span>교육 대상</span><b>${esc(f['대상']||'-')}</b></div><div class="quick-item"><span>교육 주기</span><b>${esc(f['교육횟수']||'-')}</b></div></div><div class="detail">${Object.entries(f).map(([k,v])=>`<dl class="detail-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></dl>`).join('')}<div class="memo-wrap"><input type="date" id="date-${x.no}" value="${esc(s.date)}"><textarea id="memo-${x.no}" placeholder="담당자, 이수증 보관 위치, 다음 교육 예정일 등을 기록하세요.">${esc(s.memo)}</textarea></div><div class="card-actions">${x.url?`<a class="btn primary" href="${esc(x.url)}" target="_blank" rel="noopener">교육 바로가기 ↗</a>`:`<span class="btn">${esc(x.linkText||'자체교육')}</span>`}<button class="btn success" onclick="saveDetail(${x.no})">저장</button></div></div></article>`}).join(''):'<div class="empty">조건에 맞는 교육이 없습니다.</div>';updateStats()}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('jinsul_theme',next);syncTheme()}
function syncTheme(){const dark=document.documentElement.dataset.theme==='dark';$('#themeBtn').innerHTML=dark?'☀ <span class="label">라이트모드</span>':'☾ <span class="label">다크모드</span>'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
document.documentElement.dataset.theme=localStorage.getItem('jinsul_theme')||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');syncTheme();render();
</script></body></html>
