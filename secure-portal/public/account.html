<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINSUL · 비밀번호 변경</title><link rel="stylesheet" href="/portal.css"><script type="module" src="/account.js"></script></head><body><main class="auth"><a class="brand" href="/"><span class="jinsul-logo-symbol" aria-hidden="true"><img src="/진설로고.png" alt=""></span>JINSUL</a><section class="panel"><h1>비밀번호 변경</h1><p id="identity" class="muted"></p><p class="notice" id="notice">길이 제한 없음으로 설정하세요. 변경 후 다시 로그인합니다.</p><form id="password-form"><label for="current">현재 비밀번호</label><input id="current" type="password" autocomplete="current-password" required ><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" required><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" required><button class="primary">비밀번호 변경</button></form><p id="message" class="error" role="alert"></p><div class="actions"><a class="button" href="/">업무 포털</a><button id="logout">로그아웃</button></div></section></main></body></html>
