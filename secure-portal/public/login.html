<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINSUL · 로그인</title><link rel="stylesheet" href="/portal.css"><script defer src="/login.js"></script></head><body><main class="auth"><a class="brand" href="/"><span class="jinsul-logo-symbol" aria-hidden="true"><img src="/진설로고.png" alt=""></span>JINSUL</a><section class="panel"><div class="eyebrow">INTERNAL WORKSPACE</div><h1>직원 로그인</h1><p class="muted">부여받은 계정으로 업무 포털에 접속하세요.</p><form id="login"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="40"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required ><button class="primary" type="submit">로그인</button></form><p class="error" id="message" role="alert"></p><small>비밀번호를 잊으셨다면 관리자에게 초기화를 요청하세요.<br>30분 동안 사용하지 않으면 자동으로 로그아웃됩니다.</small></section></main></body></html>
