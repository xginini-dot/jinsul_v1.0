<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINSUL · 최초 관리자 설정</title><link rel="stylesheet" href="/portal.css"><script defer src="/setup.js"></script></head><body><main class="auth"><a class="brand" href="/"><img src="/진설로고.png" alt="">JINSUL</a><section class="panel"><h1>최초 관리자 설정</h1><p class="muted">배포 시 등록한 초기 설정 키가 필요합니다. 최초 한 번만 생성할 수 있습니다.</p><form id="setup"><label for="token">초기 설정 키</label><input id="token" type="password" autocomplete="off" required><label for="username">관리자 아이디</label><input id="username" autocomplete="username" required pattern="[a-zA-Z0-9._-]{3,40}"><label for="name">이름</label><input id="name" required maxlength="60"><label for="password">비밀번호 · 12자 이상</label><input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button class="primary">관리자 생성</button></form><p id="message" class="error" role="alert"></p><a class="button" href="/login.html">로그인으로 이동</a></section></main></body></html>
