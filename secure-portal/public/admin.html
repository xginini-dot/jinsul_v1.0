<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINSUL · 직원 계정 관리</title><link rel="stylesheet" href="/portal.css"><script type="module" src="/admin.js"></script></head><body><main class="content"><header class="top"><a class="brand" href="/"><span class="jinsul-logo-symbol" aria-hidden="true"><img src="/진설로고.png" alt=""></span>JINSUL</a><div class="actions"><span id="identity"></span><a class="button" href="/">업무 포털</a><button id="theme">다크 모드</button><button id="logout">로그아웃</button></div></header><h1>직원 계정 관리</h1><p class="muted">계정 상태와 업무 권한을 관리합니다. 권한을 변경하면 해당 직원은 다시 로그인해야 합니다.</p><p id="message" class="error" role="alert"></p><section class="panel"><h2>직원 계정 추가</h2><form id="create"><div class="form-grid"><div><label for="username">아이디</label><input id="username" name="username" required pattern="[a-zA-Z0-9._-]{3,40}" autocomplete="off" placeholder="영문·숫자·._- 3~40자"></div><div><label for="name">직원 이름</label><input id="name" name="name" required maxlength="60"></div><div><label for="password">임시 비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></div><div><label for="role">역할</label><select id="role" name="role"><option value="staff">직원</option><option value="manager">책임자</option><option value="admin">관리자 · 전체 권한</option></select></div></div><fieldset><legend>접근 가능한 업무</legend><div class="checks"><label><input type="checkbox" name="permission" value="통계·매출"> 통계·매출</label><label><input type="checkbox" name="permission" value="처방·치료"> 처방·치료</label><label><input type="checkbox" name="permission" value="직원·운영"> 직원·운영</label></div></fieldset><small>책임자·직원은 선택한 업무만 이용합니다. 임시 비밀번호는 첫 로그인 시 변경합니다.</small><p><button class="primary">계정 생성</button></p></form></section><section class="panel"><div class="top"><h2>직원 목록</h2><button id="refresh">새로고침</button></div><div class="table-wrap"><table><thead><tr><th>이름 / 아이디</th><th>역할</th><th>업무 권한</th><th>상태</th><th>관리</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="panel"><h2>최근 접속·관리 기록</h2><div class="table-wrap"><table><thead><tr><th>시간</th><th>처리자</th><th>내용</th><th>대상</th></tr></thead><tbody id="audit"></tbody></table></div><small>최근 100건 표시 · 90일 보관</small></section></main><dialog id="edit"><form id="edit-form"><h2>계정 권한 변경</h2><p id="edit-username" class="muted"></p><label for="edit-name">이름</label><input id="edit-name" required maxlength="60"><label for="edit-role">역할</label><select id="edit-role"><option value="staff">직원</option><option value="manager">책임자</option><option value="admin">관리자</option></select><label for="edit-active">계정 상태</label><select id="edit-active"><option value="true">활성</option><option value="false">정지</option></select><fieldset><legend>업무 권한</legend><div class="checks"><label><input type="checkbox" name="permission" value="통계·매출"> 통계·매출</label><label><input type="checkbox" name="permission" value="처방·치료"> 처방·치료</label><label><input type="checkbox" name="permission" value="직원·운영"> 직원·운영</label></div></fieldset><p id="edit-error" class="error" role="alert"></p><div class="actions"><button class="primary">저장</button><button type="button" data-close="edit">취소</button></div></form></dialog><dialog id="reset"><form id="reset-form"><h2>비밀번호 초기화</h2><p id="reset-username" class="muted"></p><label for="reset-password">새 임시 비밀번호</label><input id="reset-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><p class="notice">기존 로그인이 해제됩니다. 직원에게 임시 비밀번호를 전달해 주세요.</p><p id="reset-error" class="error" role="alert"></p><div class="actions"><button class="primary">초기화</button><button type="button" data-close="reset">취소</button></div></form></dialog></body></html>
